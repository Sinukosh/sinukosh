        this._image.style[L.DomUtil.TRANSFORM] += ' rotate(' + this.options.rotation + 'deg)';

      _reset: function () {

    function labelPolygonSides(polygon, map, options = {}) {
      // getLatLngs() returns an array; [0] handles simple polygons
      const latlngs = polygon.getLatLngs()[0];


      const tooltips = [];

      latlngs.forEach((p1, i) => {
        // Get the next vertex, wrapping back to the first one at the end
        const p2 = latlngs[(i + 1) % latlngs.length];

        // 1. Calculate Midpoint
        const midLat = (p1.lat + p2.lat) / 2;
        const midLng = (p1.lng + p2.lng) / 2;

        // 2. Define Content (default to "Side #", or use a custom callback)
        const content = options.getContent
          ? options.getContent(p1, p2, i)
          : `Side ${i + 1}`;


        //aaa
        // 3. Create and Add Tooltip
        const tt = L.tooltip({
          permanent: true,
          direction: 'center',
          className: 'side-label-style'
        })
          .setLatLng([midLat, midLng])
          .setContent(content)
          .addTo(map);

        tooltips.push(tt);
      });

      return tooltips; // Return array so you can remove them later if needed
    }


    function getBoundsFromCenter(map, center, imgWidth, imgHeight, targetZoom) {
      // Project the center LatLng to a pixel point at the target zoom level
      var centerPoint = map.project(center, targetZoom);

      // Calculate the pixel coordinates of the corners
      var swPoint = L.point(centerPoint.x - imgWidth / 2, centerPoint.y + imgHeight / 2);
      var nePoint = L.point(centerPoint.x + imgWidth / 2, centerPoint.y - imgHeight / 2);

      // Unproject pixel points back to LatLng coordinates
      var sw = map.unproject(swPoint, targetZoom);
      var ne = map.unproject(nePoint, targetZoom);

      return L.latLngBounds(sw, ne);
    }

    async function plotPoints(px, survey) {
      px.forEach(point => {

    function startTracking() {
      locked = false;
      stableCount = 0;
      lastAcc = Infinity;
      statusEl.innerText = "Getting initial fix...";

      navigator.geolocation.getCurrentPosition(
        pos => {
          updateUI(pos);
          statusEl.innerText = "Switching to high accuracy...";
          startHighAccuracyWatch();
        },
        err => alert(err.message),
        {
          enableHighAccuracy: false,
          timeout: 5000,
          maximumAge: 60000
        }
      );
    }

    function startHighAccuracyWatch() {
      if (watchId) navigator.geolocation.clearWatch(watchId);

      watchId = navigator.geolocation.watchPosition(
        pos => {
          if (locked) return;

          const acc = pos.coords.accuracy;

          if (acc > 100) return;

          updateUI(pos);

          if (Math.abs(acc - lastAcc) < 1) {
            stableCount++;
          } else {
            stableCount = 0;
          }

          lastAcc = acc;

          if (acc <= 5 && stableCount >= 3) {
            statusEl.innerText = "High accuracy stable ✔";
            beepBtn.style.display = "block";
          } else {
            statusEl.innerText = "Improving accuracy...";
          }
        },
        err => console.warn(err),
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    function updateUI(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const acc = position.coords.accuracy;

      document.getElementById("lat").innerText = lat.toFixed(6);
      document.getElementById("lng").innerText = lng.toFixed(6);
      document.getElementById("acc").innerText = acc.toFixed(2);

      const latlng = [lat, lng];

      map.setView(latlng, 18);

      // 🔵 Create or update blue dot
      if (!locationMarker) {
        locationMarker = L.circleMarker(latlng, {
          radius: 8,
          color: "#fff",
          weight: 2,
          fillColor: "#007bff",
          fillOpacity: 1
        }).addTo(map);
      } else {
        locationMarker.setLatLng(latlng);
      }

      // 🔵 Create or update accuracy circle
      if (!accuracyCircle) {
        accuracyCircle = L.circle(latlng, {
          radius: acc,
          color: "#007bff",
          fillColor: "#007bff",
          fillOpacity: 0.2
        }).addTo(map);
      } else {
        accuracyCircle.setLatLng(latlng);
        accuracyCircle.setRadius(acc);
      }
    }

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime);

      oscillator.connect(audioCtx.destination);
      oscillator.start();

      setTimeout(() => oscillator.stop(), 300);

    // Function to load all image overlays
    function loadImageOverlays(config) {
      const overlayLayers = {};

      config.imageOverlays.forEach(overlay => {
        const center = [overlay.center.latitude, overlay.center.longitude];
        // console.log(center);

        const bounds = getBoundsFromCenter(map, center, overlay.imageWidth, overlay.imageHeight, overlay.zoomLevel);

        const layer = L.rotateImageLayer(overlay.imageUrl, bounds, {
          rotation: overlay.rotationDegree,
          opacity: overlay.opacity
        });

        if (overlay.isVisible) {
          layer.addTo(map);
        }

        overlayLayers[overlay.title] = layer;
      });

      return overlayLayers;
    }

    // Build panel UI
    function buildPanelUI() {
      let html = "";

      imageOverlaysConfig.imageOverlays.forEach((overlay) => {
        const lat = overlay.center.latitude;
        const lng = overlay.center.longitude;
        const rot = overlay.rotationDegree;
        const opac = overlay.opacity;
        overlay.aspectRatio = overlay.imageWidth / overlay.imageHeight;

          <div class="overlay-section">

            <!-- Opacity -->

              <label>👁️ Opacity <span class="range-value">${(opac * 100).toFixed(0)}%</span></label>

            </div>

            <!-- Visibility Toggle -->

              <input type="checkbox" id="visible-${overlay.id}" class="visibility-toggle" data-id="${overlay.id}" ${overlay.isVisible ? 'checked' : ''}>

            </div>

            <!-- Image Width -->

              <label>📐 Image Height (px)</label>

    // Attach event listeners to panel controls
    function attachPanelListeners() {
      // Latitude inputs
      document.querySelectorAll(".coord-lat").forEach(input => {
        input.addEventListener("change", updateOverlayCoordinates);
        input.addEventListener("input", updateOverlayCoordinates);
      });

      // Longitude inputs
      document.querySelectorAll(".coord-lng").forEach(input => {
        input.addEventListener("change", updateOverlayCoordinates);
        input.addEventListener("input", updateOverlayCoordinates);
      });

      // Rotation sliders
      document.querySelectorAll(".rotation-slider").forEach(slider => {
        slider.addEventListener("input", (e) => {
          const valueDisplay = e.target.parentElement.querySelector(".range-value");
          valueDisplay.textContent = e.target.value + "°";
          updateOverlayRotation(e);
        });
      });

      // Opacity sliders
      document.querySelectorAll(".opacity-slider").forEach(slider => {
        slider.addEventListener("input", (e) => {
          const valueDisplay = e.target.parentElement.querySelector(".range-value");
          valueDisplay.textContent = (e.target.value * 100).toFixed(0) + "%";
          updateOverlayOpacity(e);
        });
      });

      // Visibility toggles
      document.querySelectorAll(".visibility-toggle").forEach(checkbox => {
        checkbox.addEventListener("change", updateOverlayVisibility);
      });

      // Image Width
      document.querySelectorAll(".image-width").forEach(input => {
        input.addEventListener("input", updateOverlayDimensions);
      });

      // Image Height
      document.querySelectorAll(".image-height").forEach(input => {
        input.addEventListener("input", updateOverlayDimensions);
      });
    }

    function updateOverlayDimensions(e) {
      const overlayId = e.target.dataset.id;
      const overlay = imageOverlaysConfig.imageOverlays.find(
        o => o.id === overlayId
      );

      if (!overlay) return;

      if (e.target.classList.contains("image-width")) {
        overlay.imageWidth = parseInt(e.target.value) || 1;
        overlay.imageHeight = Math.round(
          overlay.imageWidth / overlay.aspectRatio
        );

        const heightInput = document.querySelector(
          `.image-height[data-id="${overlayId}"]`
        );
        if (heightInput) {
          heightInput.value = overlay.imageHeight;
        }
      }

      if (e.target.classList.contains("image-height")) {
        overlay.imageHeight = parseInt(e.target.value) || 1;
        overlay.imageWidth = Math.round(
          overlay.imageHeight * overlay.aspectRatio
        );

        const widthInput = document.querySelector(
          `.image-width[data-id="${overlayId}"]`
        );
        if (widthInput) {
          widthInput.value = overlay.imageWidth;
        }
      }

      rebuildOverlay(overlayId);
    }

    // Update overlay coordinates and rebuild layer
    function updateOverlayCoordinates(e) {
      const overlayId = e.target.dataset.id;
      const overlay = imageOverlaysConfig.imageOverlays.find(o => o.id === overlayId);
      if (!overlay) return;

      if (e.target.classList.contains("coord-lat")) {
        overlay.center.latitude = parseFloat(e.target.value);
      } else {
        overlay.center.longitude = parseFloat(e.target.value);
      }

      rebuildOverlay(overlayId);
    }

    // Update overlay rotation
    function updateOverlayRotation(e) {
      const overlayId = e.target.dataset.id;
      const overlay = imageOverlaysConfig.imageOverlays.find(o => o.id === overlayId);
      if (!overlay) return;

      overlay.rotationDegree = parseInt(e.target.value);
      rebuildOverlay(overlayId);
    }

    // Update overlay opacity
    function updateOverlayOpacity(e) {
      const overlayId = e.target.dataset.id;
      const overlay = imageOverlaysConfig.imageOverlays.find(o => o.id === overlayId);
      if (!overlay) return;

      overlay.opacity = parseFloat(e.target.value);
      rebuildOverlay(overlayId);
    }

    // Toggle overlay visibility
    function updateOverlayVisibility(e) {
      const overlayId = e.target.dataset.id;
      const overlay = imageOverlaysConfig.imageOverlays.find(o => o.id === overlayId);
      const layer = currentLayerMap[overlayId];

      if (!overlay || !layer) return;

      overlay.isVisible = e.target.checked;
      if (e.target.checked) {
        layer.addTo(map);
      } else {
        map.removeLayer(layer);
      }
    }

    // Rebuild overlay on the map
    function rebuildOverlay(overlayId) {
      const overlay = imageOverlaysConfig.imageOverlays.find(o => o.id === overlayId);
      const layer = currentLayerMap[overlayId];

      if (!overlay || !layer) return;

      // Remove old layer
      map.removeLayer(layer);

      // Create new layer with updated properties
      const center = [overlay.center.latitude, overlay.center.longitude];
      const bounds = getBoundsFromCenter(map, center, overlay.imageWidth, overlay.imageHeight, overlay.zoomLevel);

      const newLayer = L.rotateImageLayer(overlay.imageUrl, bounds, {
        rotation: overlay.rotationDegree,
        opacity: overlay.opacity
      });

      if (overlay.isVisible) {
        newLayer.addTo(map);
      }

      currentLayerMap[overlayId] = newLayer;
    }

    // Export configuration as JSON
    window.exportConfig = function () {
      const configStr = JSON.stringify(imageOverlaysConfig, null, 2);
      const blob = new Blob([configStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "overlayConfig.json";
      a.click();
      URL.revokeObjectURL(url);
    };

    // Reset configuration to defaults
    window.resetConfig = function () {
      if (confirm("Reset all overlay settings to defaults?")) {
        location.reload();
      }
    };

    // Initialize panel UI
    buildPanelUI();
  </script>
